<!DOCTYPE html>
<html>
<body>
  <!-- Netlify Forms detection — DO NOT REMOVE -->
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field" />
    <input name="firstName" />
    <input name="lastName" />
    <input name="phone" />
    <input name="email" />
    <textarea name="message"></textarea>
  </form>
  <form name="contact-full" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field" />
    <input name="name" />
    <input name="email" />
    <input name="subject" />
    <textarea name="message"></textarea>
  </form>
  <form name="newsletter" data-netlify="true" hidden>
    <input name="email" type="email" />
  </form>
  <form name="job-application" data-netlify="true" enctype="multipart/form-data" hidden>
    <input name="job" />
    <input name="noc" />
    <input name="name" />
    <input name="email" />
    <input name="phone" />
    <input name="country" />
    <input name="experience" />
    <input name="status" />
    <textarea name="message"></textarea>
    <input name="cv" type="file" />
  </form>
</body>
</html>
